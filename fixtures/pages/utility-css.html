<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Utility CSS — Login</title>
  <style>
    /* Hand-rolled utility classes standing in for Tailwind-style atomic CSS.
       No semantic hooks; class tokens carry layout/spacing meaning, not identity. */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .gap-2 { gap: 0.5rem; }
    .p-4 { padding: 1rem; }
    .rounded { border-radius: 0.25rem; }
    .bg-blue-600 { background: #2563eb; color: #fff; }
    .bg-gray-200 { background: #e5e7eb; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .border { border: 1px solid #d1d5db; }
  </style>
</head>
<body>
  <main class="flex flex-col gap-2 p-4">
    <h1>Sign in</h1>
    <form class="flex flex-col gap-2">
      <input class="border rounded px-4 py-2" name="username" type="text" placeholder="Username" />
      <input class="border rounded px-4 py-2" name="password" type="password" placeholder="Password" />
      <!-- The button that carries the intended action has no id/testid — only utility classes. -->
      <button class="bg-blue-600 rounded px-4 py-2" type="submit">Save changes</button>
      <button class="bg-gray-200 rounded px-4 py-2" type="button">Cancel</button>
    </form>
  </main>
</body>
</html>
